# Local dependencies for Firebreak. Prometheus, Loki and the services under test live in the
# separate chaos-lab repo; point PROMETHEUS_URL / LOKI_URL at it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firebreak
      POSTGRES_PASSWORD: firebreak
      POSTGRES_DB: firebreak
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firebreak']
      interval: 5s
      retries: 10

  # Temporal dev server with the Web UI on :8233. In-memory: state resets when the container
  # restarts; the worker recreates detection schedules on startup.
  temporal:
    image: temporalio/temporal:latest
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--ui-ip', '0.0.0.0']
    ports: ['7233:7233', '8233:8233']

volumes:
  pgdata:
